
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scholarships
      POSTGRES_USER: scholarship_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - scholarship_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarship_user -d scholarships"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Do not publish port 5432 to the internet.


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://scholarship_user:${POSTGRES_PASSWORD}@db:5432/scholarships
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"


  frontend:
    build:
      context: ./scholarship-finder-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  scholarship_data:
